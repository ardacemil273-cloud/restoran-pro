<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı Mod - Restoran Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      backdrop-filter: blur(10px);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      color: #ffffff;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .features {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      font-size: 12px;
      color: white;
    }

    .button {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      padding: 12px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px 5px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }

    .button-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
    }

    .button-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .cached-pages {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cached-title {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .cached-link {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      margin: 4px;
      transition: all 0.2s ease;
    }

    .cached-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    
    <h1>Çevrimdışı Mod</h1>
    <p>İnternet bağlantısı kesilmiş. Lütfen bağlantınızı kontrol edin.</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">✓</div>
        <span>Daha önce ziyaret ettiğiniz sayfalar kullanılabilir</span>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <span>Siparişleriniz kaydediliyor</span>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <span>Bağlantı geri gelince senkronize olacak</span>
      </div>
    </div>

    <div>
      <button class="button" onclick="window.location.href='/'">Ana Sayfaya Dön</button>
      <button class="button button-secondary" onclick="window.location.reload()">Yeniden Dene</button>
    </div>

    <div class="cached-pages">
      <div class="cached-title">Kullanılabilir Sayfalar</div>
      <div>
        <a href="/" class="cached-link">🏠 Ana Sayfa</a>
        <a href="/dashboard" class="cached-link">📊 Dashboard</a>
        <a href="/siparisler" class="cached-link">🛒 Siparişler</a>
        <a href="/masalar" class="cached-link">🪑 Masalar</a>
      </div>
    </div>

    <div class="status">
      <div class="status-dot"></div>
      <span>Bağlantı Kesildi</span>
    </div>
  </div>

  <script>
    // Bağlantı geri gelince otomatik olarak sayfayı yenile
    window.addEventListener('online', () => {
      console.log('Bağlantı geri geldi, sayfa yenileniyor...')
      setTimeout(() => {
        window.location.href = '/'
      }, 1000)
    })

    // Bağlantı durumunu kontrol et
    function checkConnection() {
      if (navigator.onLine) {
        console.log('Bağlantı var')
        window.location.href = '/'
      }
    }

    // Sayfa yüklendiğinde kontrol et
    checkConnection()

    // Her 5 saniyede bir kontrol et
    setInterval(checkConnection, 5000)
  </script>
</body>
</html>
